services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groundwire
      POSTGRES_PASSWORD: groundwire
      POSTGRES_DB: groundwire
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwire -d groundwire"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=groundwire
      - POSTGRES_PWD=groundwire
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8000
    ports:
      - "8088:8080"

  api:
    image: groundwire-backend:local
    build: .
    command: uvicorn groundwire.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://groundwire:groundwire@postgres:5432/groundwire
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${GROUNDWIRE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: on-failure

  worker:
    image: groundwire-backend:local
    build: .
    command: python -m groundwire.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://groundwire:groundwire@postgres:5432/groundwire
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: on-failure

  dashboard:
    build: ./dashboard
    ports:
      - "${GROUNDWIRE_DASHBOARD_PORT:-4200}:80"
    depends_on:
      - api
    restart: on-failure

volumes:
  postgres_data:
