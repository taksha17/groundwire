# Postgres data is bind-mounted to ./.data on this volume so it never lands on /.
# Docker engine data-root should be /media/taksha/New Volume/docker-data (see ~/.docker/daemon.json).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groundwire
      POSTGRES_PASSWORD: groundwire
      POSTGRES_DB: groundwire
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwire -d groundwire"]
      interval: 5s
      timeout: 5s
      retries: 20

  create-keycloak-db:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: groundwire
    entrypoint:
      - sh
      - -c
      - psql -h postgres -U groundwire -d postgres -c "CREATE DATABASE keycloak" || true
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
      create-keycloak-db:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: groundwire
      KC_DB_PASSWORD: groundwire
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8081:8080"
    restart: on-failure

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=groundwire
      - POSTGRES_PWD=groundwire
      - POSTGRES_SEEDS=postgres
    ports:
      - "127.0.0.1:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8000
    ports:
      - "127.0.0.1:8088:8080"

  api:
    image: groundwire-api:local
    build: .
    command: uvicorn groundwire.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://groundwire:groundwire@postgres:5432/groundwire
      TEMPORAL_ADDRESS: temporal:7233
      AUTH_ENABLED: "true"
      OIDC_ISSUER: http://localhost:8081/realms/groundwire
      OIDC_JWKS_URL: http://keycloak:8080/realms/groundwire/protocol/openid-connect/certs
      OIDC_AUDIENCE: groundwire-api
      APPROVAL_TIMEOUT_HOURS: ${APPROVAL_TIMEOUT_HOURS:-72}
    ports:
      - "127.0.0.1:${GROUNDWIRE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      keycloak:
        condition: service_started
    restart: on-failure

  router:
    image: groundwire-router:local
    build: ./router
    environment:
      ROUTER_ADDR: ":8090"
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure

  worker:
    image: groundwire-api:local
    build: .
    command: python -m groundwire.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://groundwire:groundwire@postgres:5432/groundwire
      TEMPORAL_ADDRESS: temporal:7233
      ROUTER_URL: http://router:8090
      APPROVAL_WEBHOOK_URL: ${APPROVAL_WEBHOOK_URL:-}
      APPROVAL_WEBHOOK_SECRET: ${APPROVAL_WEBHOOK_SECRET:-}
      TOOL_EXECUTOR_URL: ${TOOL_EXECUTOR_URL:-}
      TOOL_EXECUTOR_SECRET: ${TOOL_EXECUTOR_SECRET:-}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-http://localhost:4200}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      router:
        condition: service_started
    restart: on-failure

  dashboard:
    image: groundwire-dashboard:local
    build:
      context: ./dashboard
      dockerfile: Dockerfile.runtime
    ports:
      - "127.0.0.1:${GROUNDWIRE_DASHBOARD_PORT:-4200}:80"
    depends_on:
      - api
    restart: on-failure

  site:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${GROUNDWIRE_SITE_PORT:-4300}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./deploy/site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
